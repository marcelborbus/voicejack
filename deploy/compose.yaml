# Voicejack on hetzner: Compose project in /opt/voicejack (see README-deploy.md).
# Public access only through host nginx (voicejack.borbus.eu); the port is loopback-only.
name: voicejack

services:
  voicejack:
    image: voicejack:latest
    build:
      # Works both from the repo (deploy/compose.yaml → context ..) and on the host, where
      # src/ is a checkout of the repo: set DUB_SRC=./src in .env.
      context: ${DUB_SRC:-..}
      dockerfile: deploy/Dockerfile
    container_name: voicejack
    restart: unless-stopped
    ports:
      # Loopback only — host nginx terminates TLS for voicejack.borbus.eu.
      - '127.0.0.1:${PORT:-3087}:3000'
    environment:
      # Optional: JSON array of ICE servers (e.g. a TURN server later), sent to clients.
      ICE_SERVERS: ${ICE_SERVERS:-}
      # Dev test mode (V01): DEV_BOTS=1 in .env lets hosts add bots. Unset = off (prod default).
      DEV_BOTS: ${DEV_BOTS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Magic-link mail (V04) via the host's Postfix null client (ARCHITECTURE §7). It listens
      # on all interfaces but only accepts mynetworks (172.16.0.0/12 covers docker bridges);
      # plain SMTP, no auth. Postfix rewrites the envelope sender and the From: header.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-host.docker.internal}
      SMTP_PORT: ${SMTP_PORT:-25}
      MAIL_FROM: ${MAIL_FROM:-Voicejack <noreply@borbus.eu>}
      PUBLIC_URL: ${PUBLIC_URL:-https://voicejack.borbus.eu}
    extra_hosts:
      # Resolves to the bridge gateway, so it survives the network being recreated.
      - 'host.docker.internal:host-gateway'
    volumes:
      # Clip library (manifest.json + mp4s), rsynced from the dev box; never in the image.
      - ./clips:/app/clips:ro
      # Uploads live in ./data/uploads and are wiped on every start. The SQLite DB (accounts,
      # V03) lives in ./data/db (DB_PATH=/app/data/db/voicejack.sqlite) and is kept: back up
      # /opt/voicejack/data/db. ./data and ./data/db must be writable by uid 1000 (`node`).
      # Admin-uploaded clips (V05) live in ./data/library (LIBRARY_DIR=/app/data/library): kept,
      # back it up too (normalized mp4s, <=60 s each).
      - ./data:/app/data
    # 450m since V05: one ffmpeg normalization job (720p x264, 2 threads) runs next to the app.
    mem_limit: 450m
    memswap_limit: 450m
    cpus: 1.0
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
