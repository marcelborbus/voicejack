###############################################################################
# voicejack.borbus.eu — Voicejack (party dubbing game), PUBLIC, no Authelia gate.
# Container `voicejack` (Compose project /opt/voicejack) on 127.0.0.1:3087.
#
# Why public: it is a party game for guests who join via an invite link
# (https://voicejack.borbus.eu/r/<CODE>) and have no borbus account. Rooms are
# anonymous and short-lived (≤ 3 h, uploads wiped on restart), there is no
# persistent user data to protect, and abuse is bounded by the app itself
# (30 rooms × 8 players, per-socket WS caps, per-route REST limits, Origin
# check) plus the nginx limits below. If accounts or persistent storage are
# ever added, put an Authelia gate in front of it.
###############################################################################

# Included inside http{} (sites-enabled/*), so zone definitions are valid here.
# Room creation is the expensive, abusable call: 5/min per IP (app also limits it).
limit_req_zone $binary_remote_addr zone=dub_create:1m rate=5r/m;
# Everything else under /api (room info, chunk upload/download).
limit_req_zone $binary_remote_addr zone=dub_api:2m   rate=20r/s;
# Concurrent WebSockets per IP (a household behind one NAT is fine with 16).
limit_conn_zone $binary_remote_addr zone=dub_conn:1m;

server {
    listen 80;
    listen [::]:80;
    server_name voicejack.borbus.eu;

    include snippets/acme.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name voicejack.borbus.eu;

    include snippets/ssl-borbus.conf;

    # Largest audio chunk is 2 MiB; leave headroom, refuse anything bigger at the edge.
    client_max_body_size 4m;

    limit_req_status  429;
    limit_conn_status 429;

    # NOTE: no add_header in the locations below — it would drop the HSTS/security
    # headers that ssl-borbus.conf sets at server level (nginx inheritance rule).

    # Room creation (POST /api/rooms exactly).
    location = /api/rooms {
        limit_req zone=dub_create burst=3 nodelay;
        proxy_pass http://127.0.0.1:3087;
        include snippets/proxy.conf;
    }

    # Rest of the REST API, including chunk uploads/downloads.
    location /api/ {
        limit_req zone=dub_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3087;
        include snippets/proxy.conf;
        proxy_request_buffering off;
    }

    # Game WebSocket. proxy.conf already sets HTTP/1.1 + Upgrade/Connection
    # ($connection_upgrade from conf.d/upgrade-map.conf) and X-Forwarded-For.
    location = /ws {
        limit_conn dub_conn 16;
        proxy_pass http://127.0.0.1:3087;
        include snippets/proxy.conf;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Video clips: the app serves Range (206) + Cache-Control itself; just stream.
    location /clips/ {
        proxy_pass http://127.0.0.1:3087;
        include snippets/proxy.conf;
        proxy_buffering off;
    }

    # SPA (/, /r/<CODE>) and static assets.
    location / {
        proxy_pass http://127.0.0.1:3087;
        include snippets/proxy.conf;
    }
}

# Old name (DubParty → Voicejack, 2026-10-17): keep invite links working.
server {
    listen 80;
    listen [::]:80;
    server_name dub.borbus.eu;

    include snippets/acme.conf;
    location / { return 301 https://voicejack.borbus.eu$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dub.borbus.eu;

    include snippets/ssl-borbus.conf;
    return 301 https://voicejack.borbus.eu$request_uri;
}
